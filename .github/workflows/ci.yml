name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erp_owner
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp_owner -d erp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: erp_test
      DB_USERNAME: erp_owner            # Step 2: change to app_rw
      DB_PASSWORD: secret
      DB_OWNER_USERNAME: erp_owner
      DB_OWNER_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      PGPASSWORD: secret
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, redis, bcmath, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress
      # Step 2: create the roles, then migrate as the owner and check RLS
      # - run: psql -v ON_ERROR_STOP=1 -v app_password=secret -h 127.0.0.1 -U erp_owner -d erp_test -f database/sql/roles.sql
      # - run: php artisan migrate --database=pgsql_owner --force
      # - run: php artisan db:check-rls
      - run: php artisan migrate --force   # Step 2: delete this line
      - run: php artisan test
      - run: composer audit

  pos:
    name: POS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --passWithNoTests
      - run: npm audit --audit-level=high
