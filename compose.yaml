services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: erp_owner          # superuser: bypasses RLS, migrations only
      POSTGRES_PASSWORD: secret         # dev server only; it listens on 127.0.0.1
      POSTGRES_DB: erp
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_owner -d erp"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]

volumes:
  pgdata:
